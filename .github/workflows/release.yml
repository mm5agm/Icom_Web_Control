name: Build and Release Installer

on:
  release:
    types: [created]

  # Build every pull request into develop, so a PR arrives with a real signal
  # instead of "no checks". Added after shared-core phase 1 (#29) merged clean
  # and broke the sibling repo's build: nothing had run, because until now the
  # only ways in were a release and a manual dispatch.
  #
  # Nothing is published on this path. Both upload steps below are guarded by
  # event name, so a PR run publishes the app, builds the NSIS installer and
  # verifies it exists — then throws it away.
  pull_request:
    branches: [develop]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/upload to (e.g. v0.7.0)'
        required: false
        type: string

jobs:
  # The core tests, and the only CI that runs them from this repo.
  #
  # core/ is a git subtree of Radio_Web_Control_Core and has no test project of
  # its own here beyond that one, so this is both this repo's unit-test signal
  # and half of the shared library's. It matches the `test` job in Yaesu Web
  # Control's workflow, so the same required check can be set on develop in
  # both repos.
  #
  # ubuntu, not windows-latest like the build below: core must target net10.0
  # and never net10.0-windows, and a Linux runner is what proves it.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run unit tests
        run: dotnet test core/tests/RadioWebControl.Core.Tests/RadioWebControl.Core.Tests.csproj --configuration Release --verbosity normal

      # Links in USER_MANUAL.md, README.md and RELEASE_HISTORY.md that go
      # nowhere, and manual sections missing from the contents.
      - name: Check the docs' links
        shell: pwsh
        run: ./scripts/check-manual-links.ps1

  # The Linux and macOS build, radio control only. Its tests are the same IWC
  # tests as the Windows job, including the golden frames and the checks that
  # nothing raises DTR or opens ports by itself off Windows. Nothing is published.
  off-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run IWC tests
        run: dotnet test Tests/IcomWebControl.Tests/IcomWebControl.Tests.csproj --framework net10.0 --configuration Release --verbosity normal

      - name: Start with the simulated radio and load the pages
        run: bash scripts/ci/off-windows-smoke.sh

  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        run: |
          $v = dotnet --version 2>$null
          if ($v -and $v.StartsWith('10.')) {
            Write-Host ".NET $v already installed — skipping download"
          } else {
            Write-Host "Installing .NET 10..."
            Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile 'dotnet-install.ps1'
            .\dotnet-install.ps1 -Channel '10.0' -InstallDir "$env:LOCALAPPDATA\Microsoft\dotnet"
            $env:PATH = "$env:LOCALAPPDATA\Microsoft\dotnet;$env:PATH"
            Write-Host "Installed: $(dotnet --version)"
          }
        shell: pwsh

      # The app's own tests reference the Windows project, so they run here
      # rather than in the Linux job: CI-V framing, the controller replayed
      # against frames recorded off an IC-7300MK2, and the radio menu file.
      - name: Run IWC tests
        run: dotnet test Tests/IcomWebControl.Tests/IcomWebControl.Tests.csproj --framework net10.0-windows --configuration Release --verbosity normal
        shell: pwsh

      - name: Install NSIS
        run: choco install nsis --yes
        shell: pwsh

      - name: Publish 64-bit self-contained app
        run: |
          dotnet publish Icom_Web_Control.csproj `
            --framework net10.0-windows `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output publish
        shell: pwsh

      - name: List publish output
        run: |
          Write-Host "=== publish\\ ==="
          if (Test-Path publish) { Get-ChildItem publish -Name } else { Write-Host "publish dir missing!" }
          Write-Host "=== root ==="
          Get-ChildItem -Name
        shell: pwsh

      - name: Build NSIS installer
        run: |
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $makensis) { $makensis = "C:\\Program Files (x86)\\NSIS\\makensis.exe" }
          if (!(Test-Path $makensis)) { Write-Error "makensis.exe not found at $makensis"; exit 1 }
          Write-Host "Using NSIS at: $makensis"
          & $makensis installer.nsi
          if ($LASTEXITCODE -ne 0) { Write-Error "NSIS failed (exit $LASTEXITCODE)"; exit 1 }
          $found = Get-ChildItem -Filter "*Setup*.exe" | Select-Object -First 1
          if (!$found) { Write-Error "No *Setup*.exe found after NSIS ran"; exit 1 }
          Write-Host "NSIS produced: $($found.FullName)"
          if ($found.Name -ne "Icom_Web_Control_Setup.exe") {
            Rename-Item $found.FullName "Icom_Web_Control_Setup.exe"
            Write-Host "Renamed to Icom_Web_Control_Setup.exe"
          }
        shell: pwsh

      - name: Verify installer was created
        run: |
          if (!(Test-Path "Icom_Web_Control_Setup.exe")) {
            Write-Error "Icom_Web_Control_Setup.exe not found after build"
            exit 1
          }
          Write-Host "OK: $('{0:N0}' -f (Get-Item Icom_Web_Control_Setup.exe).Length) bytes"
        shell: pwsh

      - name: Upload installer as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Icom_Web_Control_Setup
          path: Icom_Web_Control_Setup.exe

      - name: Upload installer to GitHub Release
        if: github.event_name == 'release' || github.event.inputs.tag != ''
        run: |
          # release event carries tag in GITHUB_REF_NAME; dispatch uses the input
          if ("${{ github.event_name }}" -eq "release") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "${{ github.event.inputs.tag }}"
          }

          Write-Host "Uploading installer to release: $tag"

          gh release upload "$tag" "Icom_Web_Control_Setup.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh

  # The Mac app, radio control only, unsigned. Built on every PR and checked by
  # starting it. Published on pre-releases only while this is being tested: a full
  # release stays Windows only until Fabio has approved it.
  build-macos:
    if: github.event_name != 'release' || github.event.release.prerelease
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    env:
      MSBUILDDISABLENODEREUSE: 1
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build macOS DMG (${{ matrix.rid }})
        run: |
          bash scripts/macos/build-dmg.sh "${{ matrix.rid }}"
          ls -lh publish/dmg/*.dmg

      # macos-latest is arm64, so only that app can run here. It starts from / as
      # it does when opened from Finder, with the simulated radio, so no port opens.
      - name: Start the app and load the pages
        if: matrix.rid == 'osx-arm64'
        run: |
          exe="$PWD/publish/dmg/Icom Web Control-macos-arm64.app/Contents/MacOS/Icom_Web_Control"
          (cd / && IWC_USE_STUB_RADIO=1 IWC_NO_BROWSER=1 exec "$exe") &
          app=$!
          trap 'kill "$app" 2>/dev/null' EXIT
          IWC_SMOKE_BASE=http://localhost:8080 bash scripts/ci/off-windows-smoke.sh

      - name: Upload DMG to the pre-release
        if: github.event_name == 'release' && github.event.release.prerelease
        run: gh release upload "$GITHUB_REF_NAME" publish/dmg/*.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Linux image, radio control only. A PR builds both architectures, runs the
  # amd64 one with the simulated radio and pushes nothing. A pre-release pushes both,
  # tagged with the version and `testing`. `latest` is never moved, and a full release
  # pushes nothing, until Fabio has approved it.
  build-docker:
    if: github.event_name != 'release' || github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: write  # docker buildx GHA cache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: github.event_name == 'release'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mm5agm/icom_web_control
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=testing

      - name: Build and push both architectures
        if: github.event_name == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build arm64, as a Raspberry Pi would use
        if: github.event_name != 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build amd64 to run here
        if: github.event_name != 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: iwc:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the image with the simulated radio and load the pages
        if: github.event_name != 'release'
        run: |
          docker run -d --name iwc-smoke -e IWC_USE_STUB_RADIO=1 -p 8080:8080 iwc:smoke
          status=0
          IWC_SMOKE_BASE=http://localhost:8080 bash scripts/ci/off-windows-smoke.sh || status=$?
          if [ "$status" != 0 ]; then docker logs iwc-smoke; fi
          docker rm -f iwc-smoke
          exit "$status"
